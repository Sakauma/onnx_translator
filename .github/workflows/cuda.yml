# /**
#   ******************************************************************************
#   * @file        cuda.yml
#   * @author      Egor Izmaylov
#   * @brief       Runs CUDA-backed numerical verification on a self-hosted CUDA runner.
#   * @details     2026.06.27  V1.0.0  Created
#   ******************************************************************************
#   * @attention
#   ******************************************************************************
# */

name: CUDA

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 1"

jobs:
  cuda-smoke:
    runs-on: [self-hosted, linux, x64, cuda]
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints.txt

      - name: Run CUDA smoke verification gate
        run: |
          python tools/health_check.py --require-cuda
          make PYTHON=python verify-cuda-smoke

      - name: Upload CUDA smoke evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuda-smoke-${{ github.run_id }}
          path: |
            cache/verify_*
          if-no-files-found: warn
          retention-days: 90

  cuda-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, cuda]
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints.txt

      - name: Run full CUDA verification gate
        run: |
          python tools/health_check.py --require-cuda
          make PYTHON=python verify-cuda-full

      - name: Upload full CUDA evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuda-full-${{ github.run_id }}
          path: |
            cache/verify_*
          if-no-files-found: warn
          retention-days: 90
